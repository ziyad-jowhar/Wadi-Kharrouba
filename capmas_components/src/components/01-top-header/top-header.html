<header class="top-header">
  <div class="top-header__container">

    <a class="top-header__logo-link" href="/" aria-label="الصفحة الرئيسية">
      <img class="top-header__logo" src="assets/icons/logo.svg" alt="شعار الجهاز" width="260" height="72" />
    </a>

    <div class="top-header__tools">

      <div class="top-header__font-controls" role="group" aria-label="التحكم بحجم الخط">
        <button class="top-header__font-btn top-header__font-btn--decrement" type="button" data-font-action="decrease"
          aria-label="تصغير حجم الخط">
          <img class="top-header__font-img" src="assets/image/font-size-decrement-img.png" alt="" />
        </button>

        <button class="top-header__font-btn top-header__font-btn--default" type="button" data-font-action="reset"
          aria-label="حجم الخط الافتراضي">
          <img class="top-header__font-img" src="assets/image/font-size-default-img.png" alt="" />
        </button>

        <button class="top-header__font-btn top-header__font-btn--increment" type="button" data-font-action="increase"
          aria-label="تكبير حجم الخط">
          <img class="top-header__font-img" src="assets/image/font-size-increment-img.png" alt="" />
        </button>
      </div>

      <button class="top-header__lang-btn" type="button" aria-label="تغيير اللغة إلى الإنجليزية">
        <span class="top-header__lang-text">EN</span>
        <img class="top-header__lang-icon" src="assets/icons/lang.svg" alt="" width="18" height="18" />
      </button>

      <a class="top-header__login-btn" href="/login">
        <span class="top-header__login-text">تسجيل دخول</span>
        <img class="top-header__login-icon" src="assets/icons/login.svg" alt="" width="18" height="18" />
      </a>

    </div>
  </div>
</header>
